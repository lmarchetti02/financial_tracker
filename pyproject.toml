[project]
name = "financial-tracker"
version = "0.1.0"
description = "Luca Marchetti's Financial Tracker"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Luca Marchetti", email = "lucamarche02@gmail.com" }]
dependencies = ["flet>=0.85.0", "pydantic>=2.13.4", "pytest>=9.0.3"]

[dependency-groups]
dev = [
  "flet-cli>=0.85.0",
  "flet-desktop>=0.85.0",
  "flet-web>=0.85.0",
  "ruff>=0.15.12",
]

[tool.flet]
org = "com.mycompany"
product = "financial-tracker"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"

[tool.flet.app]
path = "src"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-s -vv -x"
testpaths = ["tests"]
pythonpath = "."
