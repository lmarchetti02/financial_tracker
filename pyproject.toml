[project]
name = "financial-tracker"
version = "1.3.1"
description = "Luca Marchetti's Financial Tracker"
readme = "README.md"
requires-python = "==3.12.*"
authors = [{ name = "Luca Marchetti", email = "lucamarche02@gmail.com" }]
dependencies = [
  "flet>=1.0.3",
  "flet-charts>=1.0.3",
  "flet-datatable2>=1.0.3",
  "matplotlib>=3.11.0",
  "numpy>=2.4.6",
  "pydantic>=2.13.4",
  "pytest>=9.0.3",
  "yfinance>=0.2.0",
]

[dependency-groups]
dev = [
  "flet-cli>=1.0.3",
  "flet-desktop>=1.0.3",
  "flet-web>=1.0.3",
  "ruff>=0.15.12",
]

[tool.flet]
org = "com.lucamarchetti"
product = "Financial Tracker"
company = "Luca Marchetti"
copyright = "Copyright (C) 2026 by Luca Marchetti"
artifact = "Financial Tracker"
bundle_id = "com.lucamarchetti.financial-tracker"

[tool.flet.app]
path = "src"

[tool.flet.macos.info]
CFBundleDisplayName = "Financial Tracker"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-s -vv -x"
testpaths = ["tests"]
pythonpath = "src"
